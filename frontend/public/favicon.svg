<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#09090b" />
  
  <g transform="translate(50, 50)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-dasharray="35 15" stroke-linecap="round" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-dasharray="15 10" stroke-linecap="round" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#cffafe" stroke-width="4" stroke-dasharray="12 6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>